<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Talk</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#76746c;--me:#1f6feb;--meink:#fff;--them:#e9e7e0;--line:#dcd9cf;--ok:#2da44e;--bad:#d1453b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1e2026;--ink:#ecebe6;--mute:#8d8b84;--me:#3b82f6;--them:#2a2d35;--line:#33363f;color-scheme:dark}}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:680px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:17px;margin:0}
#roomTag{font-size:12px;color:var(--mute)}
#status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
#dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
#dot.on{background:var(--ok)}
#log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
#log:empty::before{content:"Say hi 👋 Share the invite link so others can join.";margin:auto;color:var(--mute);font-size:14px;text-align:center;max-width:260px}
.row{display:flex;flex-direction:column;max-width:80%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.them{align-self:flex-start;align-items:flex-start}
.who{font-size:12px;color:var(--mute);margin:0 8px 2px}
.bub{padding:8px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.me .bub{background:var(--me);color:var(--meink);border-bottom-right-radius:5px}
.them .bub{background:var(--them);border-bottom-left-radius:5px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
#attach{padding:0 13px;font-size:20px}
#file{display:none}
.bub img{display:block;max-width:min(260px,65vw);max-height:360px;border-radius:12px;object-fit:contain}
input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--me)}
button{font:inherit;font-weight:600;border:0;border-radius:22px;padding:0 18px;background:var(--me);color:var(--meink);cursor:pointer}
button.ghost{background:var(--them);color:var(--ink);padding:6px 12px;font-size:13px}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
#join{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
#joinForm{flex-direction:column;border:0;background:none;width:100%;max-width:320px;text-align:center}
#joinForm h2{margin:0}
#joinForm p{margin:0 0 6px;color:var(--mute);font-size:14px}
#joinForm button{padding:12px}
label{text-align:left;font-size:13px;color:var(--mute);margin-bottom:-4px}
</style>
</head>
<body>

<div id="join">
  <form id="joinForm" autocomplete="off">
    <h2>💬 Let’s Talk</h2>
    <p>Pick a name and a room. Anyone with the same room code lands in the same chat.</p>
    <label for="name">Your name</label>
    <input id="name" maxlength="24" placeholder="e.g. Brandon" required>
    <label for="room">Room code</label>
    <input id="room" maxlength="30" placeholder="room code" required>
    <button>Join chat</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div><h1>💬 Let’s Talk</h1><div id="roomTag"></div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="status"><span id="dot"></span><span id="stxt">Connecting…</span></div>
      <button class="ghost" id="copy" type="button">🔗 Invite</button>
    </div>
  </header>
  <div id="log"></div>
  <form id="form" autocomplete="off">
    <input id="file" type="file" accept="image/*" hidden>
    <button id="attach" class="ghost" type="button" title="Share image" aria-label="Share image" disabled>＋</button>
    <input id="msg" placeholder="Type a message…" maxlength="1000" disabled>
    <button id="send" disabled>Send</button>
  </form>
</div>

<!-- PeerJS: free peer-to-peer (WebRTC) with a free public signalling server. No account, no backend. -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = 'letstalk-v1-';
const uid = Math.random().toString(36).slice(2, 8);
const log = $('log'), msg = $('msg'), send = $('send'), dot = $('dot'), stxt = $('stxt'), attach = $('attach'), file = $('file');
let name = '', room = '', peer = null, conn = null, isHost = false, session = 0, counter = 0, online = 1, ready = false;
const conns = new Map();          // host only: connection -> name
const msgs = [], seen = new Set(); // everything this browser has seen

const clean = (s, n) => String(s || '').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e]/g, '').trim().slice(0, n);
const roomClean = s => String(s || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 30);
const rand = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => (b % 36).toString(36)).join('');

/* ---------- UI ---------- */
function setStatus(t, ok) {
  ready = ok;
  dot.className = ok ? 'on' : '';
  stxt.textContent = ok ? online + ' online' : t;
  msg.disabled = send.disabled = attach.disabled = !ok;
}
function setOnline(n) { online = Math.max(1, n); if (ready) stxt.textContent = online + ' online'; }

function bubble(m) {
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  const mine = m.id.startsWith(uid + '-');
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'them');
  if (!mine) { const w = document.createElement('div'); w.className = 'who'; w.textContent = m.n; row.appendChild(w); }
  const b = document.createElement('div'); b.className = 'bub';
  if (m.type === 'image' && m.data) { const im = document.createElement('img'); im.src = m.data; im.alt = 'Shared image'; b.appendChild(im); }
  else b.textContent = m.x;
  row.appendChild(b);
  log.appendChild(row);
  if (near || mine) log.scrollTop = log.scrollHeight;
}
function renderAll() { log.textContent = ''; msgs.forEach(bubble); }

/* ---------- messages ---------- */
const okMsg = m => m && typeof m.id === 'string' && typeof m.n === 'string' && typeof m.ts === 'number' && (typeof m.x === 'string' || (m.type === 'image' && typeof m.data === 'string' && m.data.startsWith('data:image/')));
const norm = m => ({ id: m.id.slice(0, 40), n: clean(m.n, 24) || 'Guest', type: m.type === 'image' ? 'image' : 'text', data: m.type === 'image' ? m.data : undefined, x: clean(m.x, 1000), ts: m.ts });

function ingest(m) {
  if ((!m.x && m.type !== 'image') || seen.has(m.id)) return;
  seen.add(m.id); msgs.push(m);
  if (msgs.length > 300) seen.delete(msgs.shift().id);
  if (msgs.length > 1 && m.ts < msgs[msgs.length - 2].ts) { msgs.sort((a, b) => a.ts - b.ts); renderAll(); }
  else bubble(m);
}
function bcast(d) { conns.forEach((n, c) => { if (c.open) c.send(d); }); }

function sendMsg(text) {
  const id = uid + '-' + (++counter);
  if (isHost) { const m = { id, n: name, type: 'text', x: text, ts: Date.now() }; ingest(m); bcast({ k: 'msg', m }); }
  else if (conn && conn.open) conn.send({ k: 'msg', id, x: text });
}
function sendImage(data) {
  const id = uid + '-' + (++counter), m = { id, n: name, type: 'image', data, x: '', ts: Date.now() };
  if (isHost) { ingest(m); bcast({ k: 'msg', m }); }
  else if (conn && conn.open) conn.send({ k: 'image', id, data });
}

/* ---------- networking: first person in a room hosts it, others connect to the host ---------- */
function teardown() {
  if (peer) { try { peer.destroy(); } catch (e) {} }
  peer = null; conn = null; isHost = false; conns.clear();
}
function retry(text) {
  const my = session;
  setStatus(text, false);
  setTimeout(() => { if (my === session) start(); }, 800 + Math.random() * 2200);
}
function start() {
  const my = ++session;
  teardown();
  setStatus('Connecting…', false);
  const hostId = PREFIX + room;
  const p = peer = new Peer(hostId);
  p.on('open', () => {
    if (my !== session) return;
    isHost = true; setOnline(conns.size + 1); setStatus('', true); listen(p, my);
  });
  p.on('disconnected', () => { if (my === session && isHost) { try { p.reconnect(); } catch (e) {} } });
  p.on('error', e => {
    if (my !== session) return;
    if (e.type === 'unavailable-id') { p.destroy(); joinAsClient(hostId, my); }
    else retry('Problem (' + e.type + ') – retrying…');
  });
}
function listen(p, my) {
  p.on('connection', c => {
    c.on('open', () => {
      if (my !== session) return;
      conns.set(c, 'Guest'); c.send({ k: 'hist', m: msgs }); pushUsers();
    });
    c.on('data', d => {
      if (my !== session || !d) return;
      if (d.k === 'hello') { conns.set(c, clean(d.n, 24) || 'Guest'); pushUsers(); }
      else if (d.k === 'msg') {
        const x = clean(d.x, 1000), id = String(d.id || '').slice(0, 40);
        if (!x || !id) return;
        const m = { id, n: conns.get(c) || 'Guest', x, ts: Date.now() };
        ingest(m); bcast({ k: 'msg', m });
      } else if (d.k === 'image' && typeof d.data === 'string' && d.data.startsWith('data:image/') && d.data.length <= 700000) {
        const m = { id: String(d.id || '').slice(0, 40), n: conns.get(c) || 'Guest', type: 'image', data: d.data, x: '', ts: Date.now() };
        if (!m.id) return; ingest(m); bcast({ k: 'msg', m });
      }
    });
    c.on('close', () => { conns.delete(c); pushUsers(); });
  });
}
function pushUsers() { setOnline(conns.size + 1); bcast({ k: 'users', n: conns.size + 1 }); }

function joinAsClient(hostId, my) {
  const p = peer = new Peer();
  p.on('open', () => {
    if (my !== session) return;
    const c = conn = p.connect(hostId, { reliable: true });
    c.on('open', () => { if (my !== session) return; c.send({ k: 'hello', n: name }); setStatus('', true); });
    c.on('data', d => { if (my === session) onClientData(d); });
    c.on('close', () => { if (my === session) retry('Host left – reconnecting…'); });
  });
  p.on('error', e => {
    if (my !== session) return;
    retry(e.type === 'peer-unavailable' ? 'Reconnecting…' : 'Problem (' + e.type + ') – retrying…');
  });
}
function onClientData(d) {
  if (!d) return;
  if (d.k === 'msg' && okMsg(d.m)) ingest(norm(d.m));
  else if (d.k === 'users') setOnline(+d.n || 1);
  else if (d.k === 'hist' && Array.isArray(d.m)) {
    let changed = false;
    d.m.slice(-300).forEach(m => {
      if (okMsg(m) && !seen.has(m.id)) { const n = norm(m); if (n.x || n.type === 'image') { seen.add(n.id); msgs.push(n); changed = true; } }
    });
    if (changed) { msgs.sort((a, b) => a.ts - b.ts); renderAll(); }
  }
}

/* ---------- wiring ---------- */
try { $('name').value = localStorage.getItem('lt-name') || ''; } catch (e) {}
$('room').value = roomClean(location.hash.slice(1)) || rand();

$('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  name = clean($('name').value, 24); room = roomClean($('room').value);
  if (!name || !room) return;
  try { localStorage.setItem('lt-name', name); } catch (e) {}
  location.hash = room;
  $('roomTag').textContent = 'Room: ' + room;
  $('join').hidden = true; $('app').hidden = false;
  start();
});
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const t = clean(msg.value, 1000);
  if (!t || !ready) return;
  msg.value = ''; sendMsg(t); msg.focus();
});
async function shareImage(blob) {
  if (!ready) { alert('Connect to the room before sharing an image.'); return; }
  if (!blob || !blob.type.startsWith('image/')) return;
  try {
    const bitmap = await createImageBitmap(blob), scale = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas'); canvas.width = Math.round(bitmap.width * scale); canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height); bitmap.close();
    let data = canvas.toDataURL('image/jpeg', .72);
    if (data.length > 650000) data = canvas.toDataURL('image/jpeg', .5);
    if (data.length > 700000) { alert('Image is too large. Choose a smaller image.'); return; }
    sendImage(data);
  } catch (e) { alert('Could not process this image. Try another one.'); }
}
attach.addEventListener('click', () => file.click());
file.addEventListener('change', () => { const f = file.files && file.files[0]; if (f) shareImage(f); file.value = ''; });
msg.addEventListener('paste', e => { const item = Array.from(e.clipboardData.items || []).find(i => i.type.startsWith('image/')); if (item) { e.preventDefault(); shareImage(item.getAsFile()); } });
$('copy').addEventListener('click', async () => {
  const b = $('copy');
  try { await navigator.clipboard.writeText(location.href); b.textContent = 'Copied ✓'; }
  catch (e) { prompt('Copy this invite link:', location.href); }
  setTimeout(() => b.textContent = '🔗 Invite', 1500);
});
</script>
</body>
</html>
